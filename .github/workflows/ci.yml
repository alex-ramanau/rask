name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The ack3 checkout whose test suite is the spec. Until the ACK_TEST_BINARY
  # harness change is merged upstream, ci/ack3-test-binary.patch is applied.
  ACK3_REPOSITORY: beyondgrep/ack3
  ACK3_REF: dev

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests that use ack3's fixtures skip themselves here; the ack-suite job runs them.
      - run: cargo test --all

  ack-suite:
    name: ack3 suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: rask
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ACK3_REPOSITORY }}
          ref: ${{ env.ACK3_REF }}
          path: ack3
      - name: Apply ACK_TEST_BINARY harness patch if needed
        shell: bash
        working-directory: ack3
        run: grep -q ACK_TEST_BINARY t/Util.pm || git apply ../rask/ci/ack3-test-binary.patch
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules: File::Next YAML::PP ${{ runner.os == 'Windows' && 'Win32::ShellQuote' || 'IO::Pty' }}
      - uses: dtolnay/rust-toolchain@stable
      # The perl steps use pwsh, not bash: on Windows, bash is Git Bash, whose
      # own MSYS perl comes first on its PATH instead of the one set up above.
      - name: Build ack3 (some tests use App::Ack as the oracle)
        shell: pwsh
        working-directory: ack3
        run: |
          perl Makefile.PL
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $make = perl -MConfig -e 'print $Config{make}'
          & $make
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: cargo build
        working-directory: rask
      - name: Unit and integration tests, with ack3's fixtures
        run: cargo test --all
        working-directory: rask
        env:
          ACK3_DIR: ${{ github.workspace }}/ack3
      - run: cargo build --release
        working-directory: rask
      - name: Run the ack3 suite against rask
        shell: pwsh
        working-directory: rask
        env:
          ACK3_DIR: ${{ github.workspace }}/ack3
        # Reports pass counts without failing the job: the suite is green on
        # Linux, but macOS and Windows haven't been through it yet.
        run: perl scripts/ack-suite --markdown $env:GITHUB_STEP_SUMMARY
      - name: Compare with Perl ack on the differential cases
        if: runner.os != 'Windows'
        working-directory: rask
        env:
          ACK3_DIR: ${{ github.workspace }}/ack3
        run: |
          scripts/diff-ack --cases tests/diff/phase1.txt
          scripts/diff-ack --cases tests/diff/phase2.txt
          RASK=target/release/rask scripts/texttest-vs-perl 1 2 3
